name: Build Fabric Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # pipefail: nếu gradle fail thì step fail luôn, không bị tee che
      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: List build output
        if: always()
        run: ls -la build/libs/ 2>/dev/null || echo "build/libs missing"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: gradle-build.log
          if-no-files-found: warn

      - name: Collect mod jar
        if: always()
        run: |
          mkdir -p artifacts
          if [ -d "build/libs" ]; then
            find build/libs -name "*.jar" ! -name "*-sources.jar" -exec cp {} artifacts/ \;
          else
            echo "build/libs không tồn tại, tìm toàn project"
            find . -path "*/build/libs/*.jar" ! -name "*-sources.jar" -exec cp {} artifacts/ \;
          fi
          ls -la artifacts/ || true

      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spearcheat-mod
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
