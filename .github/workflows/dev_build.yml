name: Build Fabric Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      # Debug: xem có file gì trong build/libs không
      - name: List build output
        if: always()
        run: |
          echo "=== build/libs contents ==="
          ls -la build/libs/ || echo "build/libs does not exist"

      # Đổi sang copy file ra folder riêng để tránh lỗi pattern exclusion
      - name: Collect mod jar
        run: |
          mkdir -p artifacts
          cp build/libs/*.jar artifacts/
          rm -f artifacts/*-sources.jar

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: spearcheat-mod
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
