name: Build Fabric Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Build — in toàn bộ log ra, fail hard nếu lỗi
      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace 2>&1 | tee gradle-build.log
        shell: bash

      # Chạy kể cả khi build fail — để biết có gì trong build/libs
      - name: List build output
        if: always()
        run: |
          echo "===== build/libs ====="
          ls -la build/libs/ 2>/dev/null || echo "MISSING: build/libs does not exist"
          echo "===== project root ====="
          ls -la

      # Upload log để đọc nếu build fail
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: gradle-build.log
          if-no-files-found: warn

      # Chỉ chạy nếu build thành công
      - name: Collect mod jar
        if: success()
        run: |
          mkdir -p artifacts
          find build/libs -name "*.jar" ! -name "*-sources.jar" -exec cp {} artifacts/ \;
          echo "===== artifacts ====="
          ls -la artifacts/

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spearcheat-mod
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
