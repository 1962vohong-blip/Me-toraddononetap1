name: Build Fabric Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # In thẳng ra Actions log, không dùng pipe hay tee
      # continue-on-error để bước sau vẫn chạy và thấy được output
      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace --info
        continue-on-error: true

      - name: Check build result
        run: |
          echo "=== Checking build output ==="
          ls -la build/ 2>/dev/null || echo "build/ folder missing entirely"
          ls -la build/libs/ 2>/dev/null || echo "build/libs/ missing"

      - name: Collect mod jar
        run: |
          mkdir -p artifacts
          find build/libs -name "*.jar" ! -name "*-sources.jar" -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: spearcheat-mod
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
